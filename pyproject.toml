[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-swarm-simulator"
version = "0.1.0"
description = "2D drone swarm simulator: point-mass drones with exact integration, flocking, graph-consensus formation control, velocity-obstacle collision avoidance, auction task allocation, Lloyd coverage and the Vicsek model, each cross-checked against an analytic or independent result"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SafraNako" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
dronesuru = "drone_suru_simulatoru.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning:matplotlib"]
